name: FHIR IG CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sushi:
    name: SUSHI – FSH kompilering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Run SUSHI
        run: sushi build . --log-level info

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsh-generated
          path: fsh-generated/

  ig-publisher:
    name: IG Publisher – publicering
    needs: sushi
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download SUSHI artifacts
        uses: actions/download-artifact@v4
        with:
          name: fsh-generated
          path: fsh-generated/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SUSHI
        run: npm install -g fsh-sushi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Jekyll
        run: sudo gem install jekyll bundler

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -L https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o input-cache/publisher.jar

      - name: Run IG Publisher
        run: |
          java -Xmx4g -jar input-cache/publisher.jar \
            -ig ig.ini \
            -no-sushi \
            -tx https://tx.fhir.org/r5

      - name: Upload IG output
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: output/

  deploy-pages:
    name: GitHub Pages – deployment (gh-pages)
    needs: ig-publisher
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Download IG output
        uses: actions/download-artifact@v4
        with:
          name: ig-output
          path: output/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: output/
          force_orphan: true
          commit_message: "Deploy IG from ${{ github.sha }}"
